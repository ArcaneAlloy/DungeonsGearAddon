modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# ej_fixes patches Dungeons Libraries' built-in-enchantment logic, so make
# sure it's present and loaded first. Add further [[dependencies.${mod_id}]]
# blocks here as future fixes target other mods.
[[dependencies.${mod_id}]]
    modId="dungeons_libraries"
    mandatory=true
    versionRange="[1.19,)"
    ordering="AFTER"
    side="BOTH"

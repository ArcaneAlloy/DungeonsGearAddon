buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[5.1,5.2)'
}
apply plugin: 'org.spongepowered.mixin'

version = mod_version
group = mod_group_id

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = '17'

// Jar filename only — kept independent from mod_id (the internal Forge
// modid, and therefore the mixins.json/refmap filenames, stay "ej_fixes"
// unchanged) so this rename touches nothing else.
archivesBaseName = 'dungeons_gear_addon'

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // Dev-only: the game runs deobfuscated here, so Mixin needs to
            // re-translate the refmap (official -> SRG) back through this
            // SRG-to-MCP table to find the real target. Production doesn't
            // need this — there, classes are already SRG-named and the
            // refmap is used directly.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                ej_fixes {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                ej_fixes {
                    source sourceSets.main
                }
            }
        }
    }
}

// MixinGradle: generates ej_fixes.refmap.json during compilation (mapping
// the friendly/official names we write in @Mixin targets to the real SRG
// names Mixin encounters at the point it applies, since Mixin operates on
// vanilla classes before Forge renames them) and bundles it into the jar.
mixin {
    add sourceSets.main, "ej_fixes.refmap.json"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// mods.toml uses ${mod_id}, ${mod_version}, etc. — without this block those
// placeholders are copied into the jar literally instead of being replaced,
// which produces an invalid modid and makes FML fail to parse the mod file
// (silently, before crash-report handling is even set up).
def resourceTargets = ['META-INF/mods.toml']
def replaceProperties = [
        minecraft_version      : minecraft_version, minecraft_version_range: minecraft_version_range,
        forge_version          : forge_version, forge_version_range: forge_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
        mod_authors            : mod_authors, mod_description: mod_description,
]
processResources {
    inputs.properties replaceProperties
    filesMatching(resourceTargets) {
        expand replaceProperties + [project: project]
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Jars dropped in libs/ (Dungeons Libraries, Dungeons Gear, or any other
    // mod a future fix's @Mixin targets) — compileOnly so the Mixin
    // annotation processor can resolve the target class at build time,
    // without shading that mod's code into ej_fixes' own jar. The actual
    // classes are provided at runtime by the real mod jars in the modpack.
    compileOnly fileTree(dir: 'libs', include: '*.jar')
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Specification-Title"   : mod_id,
                "Specification-Vendor"  : mod_authors,
                "Specification-Version" : "1",
                "Implementation-Title"  : project.name,
                "Implementation-Version": project.jar.archiveVersion,
                "Implementation-Vendor" : mod_authors,
                "MixinConfigs"          : "${mod_id}.mixins.json"
        ])
    }
}
